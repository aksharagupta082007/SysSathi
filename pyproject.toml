[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syssathi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp~=4.1",
    "psutil>=5.9",
    "openai>=1.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
